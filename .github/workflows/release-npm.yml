name: Release npm Courier

# Publishes the `promptkit-os` npm wrapper on GitHub release. The wrapper is a courier:
# this job syncs its version to the release tag and publishes with provenance attestation.
# It never publishes PromptKit OS itself as a runtime, and never touches the product logic.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync and publish (e.g. v1.9.0)"
        required: true

permissions:
  contents: read
  id-token: write # required for npm provenance attestation (OIDC)

jobs:
  publish-npm-courier:
    name: Publish npm Courier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so the smoke test can `git archive` the tag under test. A depth-1
          # clone checks out the tag's commit but does not reliably carry the tag ref.
          fetch-depth: 0

      - name: Resolve Release Tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag must look like v1.9.0, got '$TAG'"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing courier version $VERSION from tag $TAG"

      - name: Validate Release Tag Exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git ls-remote --exit-code --tags "origin" "refs/tags/$TAG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No `registry-url` here, deliberately. Passing it makes setup-node write a
          # userconfig .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
          # That makes npm take the TOKEN auth path even when the variable is empty, so it
          # never attempts the OIDC trusted-publishing exchange at all. The v1.9.1 release
          # failed with E404 for exactly this reason: the OIDC token was minted and the
          # provenance statement was signed, but the publish still went out as a token
          # publish. Trusted publishing needs no registry config, so we simply omit it.
          # No `cache: npm` — this package is intentionally zero-dependency, so no
          # lockfile exists to key a cache on. setup-node fails hard on a missing
          # cache-dependency-path, which would break the first release at this step.

      # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1 and Node >= 22.14.0.
      # The feature gate lives on the npm CLI, not on Node: npm 10 does not attempt the
      # OIDC exchange at all, so with no NODE_AUTH_TOKEN present it fails to
      # authenticate. Bumping `node-version` alone is not reliable either (Node 22 can
      # bundle npm 10, and early Node 24 bundled npm 11.4.x), so pin the CLI explicitly.
      - name: Ensure npm Supports Trusted Publishing
        run: npm install -g npm@^11.5.1

      # Fail loudly and early if anything would silently divert the publish off OIDC.
      # A token present here is the exact condition that broke v1.9.1, and it fails at the
      # last step of a release rather than at a point anyone is watching.
      - name: Assert No Token Auth Will Be Used
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set in the job environment; npm would bypass trusted publishing and attempt a token publish. Remove it."
            exit 1
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is set in the job environment; npm would bypass trusted publishing and attempt a token publish. Remove it."
            exit 1
          fi
          for rc in "${NPM_CONFIG_USERCONFIG:-}"; do
            [ -z "$rc" ] && continue
            if [ -f "$rc" ] && grep -qiE '_authToken|_auth[[:space:]]*=' "$rc"; then
              echo "::error::$rc contains an auth token entry; npm would bypass trusted publishing. Remove the registry-url input from Setup Node."
              exit 1
            fi
          done
          echo "No token auth present — publish will use npm trusted publishing (OIDC)."

      - name: Sync Courier Version to Release Tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cd package
          npm version "$VERSION" --no-git-tag-version
          # Refuse to ship a wrapper whose version drifted from the tag it claims to mirror.
          node -e "const p=require('./package.json'); if(p.version!==process.env.VERSION){console.error('version mismatch');process.exit(1)}"
          echo "Courier version: $(node -p "require('./package.json').version")"

      - name: Verify Courier Contents Are Minimal
        run: |
          cd package
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const allowed = new Set(['package.json','README.md','bin/promptkit-os.js']);
            const extra = files.filter(f => !allowed.has(f));
            if (extra.length) { console.error('unexpected files in tarball:', extra); process.exit(1); }
            console.log('tarball contents verified:', files.join(', '));
          "

      - name: Smoke Test Courier Against This Release
        env:
          PROMPTKIT_VERSION: ${{ steps.tag.outputs.version }}
        run: bash package/test/smoke.sh

      - name: Publish to npm with Provenance
        working-directory: package
        # Trusted publishing (OIDC): no long-lived token. The npmjs.com trusted
        # publisher entry (repo promptkit-os, workflow release-npm.yml) mints a
        # short-lived credential via the job's id-token; provenance is automatic.
        # The dashboard entry's optional Environment field must be left EMPTY,
        # because this job declares no `environment:` key — a non-empty value there
        # makes the OIDC exchange 403 on publisher mismatch.
        run: npm publish --provenance --access public

      - name: Report
        run: |
          echo "::notice::published promptkit-os@${{ steps.tag.outputs.version }} (courier for ${{ steps.tag.outputs.tag }})"
