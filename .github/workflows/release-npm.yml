name: Release npm Courier

# Publishes the `promptkit-os` npm wrapper on GitHub release. The wrapper is a courier:
# this job syncs its version to the release tag and publishes with provenance attestation.
# It never publishes PromptKit OS itself as a runtime, and never touches the product logic.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync and publish (e.g. v1.9.0)"
        required: true
      dry_run:
        description: "Verify the release without publishing to npm"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate and Pack npm Courier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      tag_commit: ${{ steps.release_source.outputs.tag_commit }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # Start from trusted default-branch tooling before examining release-tag files.
          # Full history fetches tags so the smoke test can archive the tag under test.
          fetch-depth: 0

      - name: Resolve Release Tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag must look like v1.9.0, got '$TAG'"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing courier version $VERSION from tag $TAG"

      - name: Validate Release Tag Exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git ls-remote --exit-code --tags "origin" "refs/tags/$TAG"

      - name: Preserve Hardened Smoke Harness
        run: |
          mkdir -p "$RUNNER_TEMP/hardened-smoke"
          cp package/test/smoke.sh "$RUNNER_TEMP/hardened-smoke/smoke.sh"
          cp scripts/verify-release-archive.py "$RUNNER_TEMP/hardened-smoke/verify-release-archive.py"
          cp scripts/mint-courier-integrity-pin.sh "$RUNNER_TEMP/hardened-smoke/mint-courier-integrity-pin.sh"
          chmod +x "$RUNNER_TEMP/hardened-smoke/smoke.sh"
          chmod +x "$RUNNER_TEMP/hardened-smoke/mint-courier-integrity-pin.sh"

      - name: Checkout Resolved Release Tag
        id: release_source
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # --force is required, not lazy: actions/checkout already fetched this tag
          # (fetch-depth: 0 pulls tags), so a plain fetch aborts with
          # "would clobber existing tag" under `bash -e` before the checkouts run.
          # The explicit refspec also makes the intent unambiguous.
          git fetch --force --prune origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_COMMIT=$(git rev-parse --verify -q "refs/tags/${TAG}^{commit}")
          if [ -z "$TAG_COMMIT" ]; then
            echo "::error::Could not resolve tag refs/tags/$TAG to a commit"
            exit 1
          fi
          git merge-base --is-ancestor "$TAG_COMMIT" "origin/$DEFAULT_BRANCH" || { echo "::error::release tag $TAG is not reachable from $DEFAULT_BRANCH"; exit 1; }
          git checkout --detach "$TAG_COMMIT"
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "$CURRENT_HEAD" != "$TAG_COMMIT" ]; then
            echo "::error::HEAD ($CURRENT_HEAD) does not match resolved tag commit ($TAG_COMMIT)"
            exit 1
          fi
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Successfully checked out detached commit $TAG_COMMIT for tag $TAG"

      - name: Sync Courier Version to Release Tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cd package
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          # Refuse to ship a wrapper whose version drifted from the tag it claims to mirror.
          node -e "const p=require('./package.json'); if(p.version!==process.env.VERSION){console.error('version mismatch');process.exit(1)}"
          echo "Courier version: $(node -p "require('./package.json').version")"

      - name: Mint and Inject Courier Integrity Pin
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG_COMMIT: ${{ steps.release_source.outputs.tag_commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid release tag '$TAG'"; exit 1; }
          [[ "$VERSION" == "${TAG#v}" ]] || { echo "::error::release version does not match tag"; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="https://github.com/$REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          curl --fail --silent --show-error --location "$archive" --output "$work/first.tar.gz"
          curl --fail --silent --show-error --location "$archive" --output "$work/second.tar.gz"
          gzip -t "$work/first.tar.gz"
          gzip -t "$work/second.tar.gz"
          first="$(sha256sum "$work/first.tar.gz" | cut -d' ' -f1)"
          second="$(sha256sum "$work/second.tar.gz" | cut -d' ' -f1)"
          [[ "$first" == "$second" ]] || { echo "::error::release archive downloads were not reproducible"; exit 1; }
          python3 "$RUNNER_TEMP/hardened-smoke/verify-release-archive.py" --archive "$work/first.tar.gz" --commit "$TAG_COMMIT"
          digest="$first"
          export DIGEST="$digest"
          bash "$RUNNER_TEMP/hardened-smoke/mint-courier-integrity-pin.sh" package/bin/promptkit-os.js "$VERSION" "$digest"
          node - <<'NODE'
          const courier = require('./package/bin/promptkit-os.js');
          const version = process.env.VERSION;
          if (courier.TARBALL_SHA256_BY_VERSION[version] !== process.env.DIGEST) {
            throw new Error(`post-injection integrity pin check failed for ${version}`);
          }
          console.log(`Verified courier integrity pin ${version}: ${process.env.DIGEST}`);
          NODE

      - name: Smoke Test Courier Against This Release
        env:
          PROMPTKIT_VERSION: ${{ steps.tag.outputs.version }}
          PROMPTKIT_REPO_ROOT: ${{ github.workspace }}
          PROMPTKIT_REQUIRE_INTEGRITY_PIN: "1"
        run: bash "$RUNNER_TEMP/hardened-smoke/smoke.sh"

      - name: Confirm Release Tag Still Targets Checked-Out Commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TAG_COMMIT: ${{ steps.release_source.outputs.tag_commit }}
        run: |
          set -euo pipefail
          refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          current="$(printf '%s\n' "$refs" | awk -v tag="refs/tags/$TAG" '$2 == tag { direct=$1 } $2 == tag "^{}" { peeled=$1 } END { if (peeled != "") print peeled; else print direct }')"
          [[ "$current" == "$TAG_COMMIT" ]] || { echo "::error::release tag $TAG no longer targets checked-out commit $TAG_COMMIT"; exit 1; }

      - name: Reject Manual Publish Outside Main
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref != 'refs/heads/main'
        run: |
          echo "::error::manual publication must use the protected main workflow ref"
          exit 1

      - name: Report Dry Run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TAG_COMMIT: ${{ steps.release_source.outputs.tag_commit }}
        run: echo "Dry run complete for $TAG at $TAG_COMMIT; npm publish was skipped."

  pack-release:
    name: Build Verified npm Courier Artifact
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ needs.validate-release.outputs.version }}
    steps:
      - name: Checkout Trusted Repository Tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm Release Tag Still Targets Valid Mainline Commit
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          TAG_COMMIT: ${{ needs.validate-release.outputs.tag_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          current="$(printf '%s\n' "$refs" | awk -v tag="refs/tags/$TAG" '$2 == tag { direct=$1 } $2 == tag "^{}" { peeled=$1 } END { if (peeled != "") print peeled; else print direct }')"
          [[ "$current" == "$TAG_COMMIT" ]] || { echo "::error::release tag $TAG moved after validation"; exit 1; }
          git merge-base --is-ancestor "$TAG_COMMIT" "origin/$DEFAULT_BRANCH" || { echo "::error::release tag $TAG is not reachable from $DEFAULT_BRANCH"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Assemble Courier from Release Commit Data
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          TAG_COMMIT: ${{ needs.validate-release.outputs.tag_commit }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/courier-source"
          mkdir -p "$source_dir/bin"
          git show "$TAG_COMMIT:package/package.json" > "$source_dir/package.json"
          git show "$TAG_COMMIT:package/README.md" > "$source_dir/README.md"
          git show "$TAG_COMMIT:package/bin/promptkit-os.js" > "$source_dir/bin/promptkit-os.js"
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            if (pkg.name !== "promptkit-os") throw new Error("unexpected courier package name");
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          ' "$source_dir/package.json"
          archive="https://github.com/$REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          curl --fail --silent --show-error --location "$archive" --output "$RUNNER_TEMP/release.tar.gz"
          python3 scripts/verify-release-archive.py --archive "$RUNNER_TEMP/release.tar.gz" --commit "$TAG_COMMIT"
          digest="$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d' ' -f1)"
          bash scripts/mint-courier-integrity-pin.sh "$source_dir/bin/promptkit-os.js" "$VERSION" "$digest"

      - name: Pack and Verify Exact Courier Artifact
        id: pack
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP" "$RUNNER_TEMP/courier-source")"
          path="$RUNNER_TEMP/$tarball"
          [[ -f "$path" ]] || { echo "::error::npm pack did not produce $tarball"; exit 1; }
          python3 - "$path" "$VERSION" <<'PY'
          import json
          import sys
          import tarfile

          path, expected_version = sys.argv[1:]
          expected = {"package/package.json", "package/README.md", "package/bin/promptkit-os.js"}
          with tarfile.open(path, "r:gz") as archive:
              members = archive.getmembers()
              files = [member for member in members if member.isfile()]
              names = [member.name for member in files]
              directories = {member.name.rstrip("/") for member in members if member.isdir()}
              if set(names) != expected or len(names) != len(expected) or directories - {"package", "package/bin"}:
                  raise SystemExit(f"unexpected courier tarball entries: {sorted(member.name for member in members)}")
              if any(not (member.isfile() or member.isdir()) for member in members):
                  raise SystemExit("courier tarball contains a link or unsupported entry")
              manifest = json.load(archive.extractfile("package/package.json"))
              if manifest.get("name") != "promptkit-os" or manifest.get("version") != expected_version:
                  raise SystemExit("courier tarball manifest does not match the release name and version")
          PY
          digest="$(sha256sum "$path" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "Verified exact courier artifact $tarball ($digest)"

      - name: Upload Verified Courier Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-courier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish-npm-courier:
    name: Publish npm Courier
    needs: pack-release
    if: github.event_name == 'release' || (inputs.dry_run == false && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm provenance attestation (OIDC)
    steps:
      - name: Download Verified Courier Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-courier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/courier

      - name: Verify Courier Artifact
        env:
          TARBALL_NAME: ${{ needs.pack-release.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.pack-release.outputs.sha256 }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/courier/$TARBALL_NAME"
          [[ -f "$path" ]] || { echo "::error::verified courier artifact is missing"; exit 1; }
          actual="$(sha256sum "$path" | cut -d' ' -f1)"
          [[ "$actual" == "$EXPECTED_SHA256" ]] || { echo "::error::courier artifact digest mismatch"; exit 1; }
          echo "TARBALL=$path" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Ensure npm Supports Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Validate Runtime and CLI Versions for Trusted Publishing
        run: |
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 14)) throw new Error(`Node >= 22.14.0 required, got ${process.version}`);
          '
          node -e '
            const [major, minor, patch] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error(`npm >= 11.5.1 required, got ${major}.${minor}.${patch}`);
          '

      - name: Assert No Token Auth Will Be Used
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::A long-lived npm token is set; trusted publishing must use OIDC only."
            exit 1
          fi

      - name: Publish to npm with Provenance
        # Publish the verified tarball without executing package lifecycle scripts.
        # The npmjs.com trusted publisher entry must use this workflow without an Environment.
        run: npm publish "$TARBALL" --provenance --access public --ignore-scripts

      - name: Report
        if: success()
        run: |
          echo "::notice::published promptkit-os@${{ needs.pack-release.outputs.version }} with provenance"
