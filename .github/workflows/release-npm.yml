name: Release npm Courier

# Publishes the `promptkit-os` npm wrapper on GitHub release. The wrapper is a courier:
# this job syncs its version to the release tag and publishes with provenance attestation.
# It never publishes PromptKit OS itself as a runtime, and never touches the product logic.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync and publish (e.g. v1.9.0)"
        required: true

permissions:
  contents: read
  id-token: write # required for npm provenance attestation (OIDC)

jobs:
  publish-npm-courier:
    name: Publish npm Courier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so the smoke test can `git archive` the tag under test. A depth-1
          # clone checks out the tag's commit but does not reliably carry the tag ref.
          fetch-depth: 0

      - name: Resolve Release Tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag must look like v1.9.0, got '$TAG'"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing courier version $VERSION from tag $TAG"

      - name: Validate Release Tag Exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git ls-remote --exit-code --tags "origin" "refs/tags/$TAG"

      - name: Preserve Hardened Smoke Harness
        run: |
          mkdir -p "$RUNNER_TEMP/hardened-smoke"
          cp package/test/smoke.sh "$RUNNER_TEMP/hardened-smoke/smoke.sh"
          chmod +x "$RUNNER_TEMP/hardened-smoke/smoke.sh"

      - name: Checkout Resolved Release Tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # --force is required, not lazy: actions/checkout already fetched this tag
          # (fetch-depth: 0 pulls tags), so a plain fetch aborts with
          # "would clobber existing tag" under `bash -e` before the checkouts run.
          # The explicit refspec also makes the intent unambiguous.
          git fetch --force --prune origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_COMMIT=$(git rev-parse --verify -q "refs/tags/${TAG}^{commit}")
          if [ -z "$TAG_COMMIT" ]; then
            echo "::error::Could not resolve tag refs/tags/$TAG to a commit"
            exit 1
          fi
          git checkout --detach "$TAG_COMMIT"
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "$CURRENT_HEAD" != "$TAG_COMMIT" ]; then
            echo "::error::HEAD ($CURRENT_HEAD) does not match resolved tag commit ($TAG_COMMIT)"
            exit 1
          fi
          echo "Successfully checked out detached commit $TAG_COMMIT for tag $TAG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No `registry-url` here, deliberately. Passing it makes setup-node write a
          # userconfig .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
          # That makes npm take the TOKEN auth path even when the variable is empty, so it
          # never attempts the OIDC trusted-publishing exchange at all. The v1.9.1 release
          # failed with E404 for exactly this reason: the OIDC token was minted and the
          # provenance statement was signed, but the publish still went out as a token
          # publish. Trusted publishing needs no registry config, so we simply omit it.
          # No `cache: npm` — this package is intentionally zero-dependency, so no
          # lockfile exists to key a cache on. setup-node fails hard on a missing
          # cache-dependency-path, which would break the first release at this step.

      # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1 and Node >= 22.14.0.
      # The feature gate lives on the npm CLI, not on Node: npm 10 does not attempt the
      # OIDC exchange at all, so with no NODE_AUTH_TOKEN present it fails to
      # authenticate. Bumping `node-version` alone is not reliable either (Node 22 can
      # bundle npm 10, and early Node 24 bundled npm 11.4.x), so pin the CLI explicitly.
      - name: Ensure npm Supports Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Validate Runtime and CLI Versions for Trusted Publishing
        run: |
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 14)) {
              console.error(`Node >= 22.14.0 required for trusted publishing, got ${process.version}`);
              process.exit(1);
            }
            console.log(`Node version validated: ${process.version}`);
          '
          node -e '
            const { execSync } = require("child_process");
            const v = execSync("npm --version").toString().trim();
            const [major, minor, patch] = v.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`npm >= 11.5.1 required for trusted publishing, got ${v}`);
              process.exit(1);
            }
            console.log(`npm CLI version validated: ${v}`);
          '

      # Fail loudly and early if anything would silently divert the publish off OIDC.
      # A token present here is the exact condition that broke v1.9.1, and it fails at the
      # last step of a release rather than at a point anyone is watching.
      - name: Assert No Token Auth Will Be Used
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set in the job environment; npm would bypass trusted publishing and attempt a token publish. Remove it."
            exit 1
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is set in the job environment; npm would bypass trusted publishing and attempt a token publish. Remove it."
            exit 1
          fi
          for rc in "${NPM_CONFIG_USERCONFIG:-}"; do
            [ -z "$rc" ] && continue
            if [ -f "$rc" ] && grep -qiE '_authToken|_auth[[:space:]]*=' "$rc"; then
              echo "::error::$rc contains an auth token entry; npm would bypass trusted publishing. Remove the registry-url input from Setup Node."
              exit 1
            fi
          done
          echo "No token auth present — publish will use npm trusted publishing (OIDC)."

      - name: Sync Courier Version to Release Tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cd package
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Refuse to ship a wrapper whose version drifted from the tag it claims to mirror.
          node -e "const p=require('./package.json'); if(p.version!==process.env.VERSION){console.error('version mismatch');process.exit(1)}"
          echo "Courier version: $(node -p "require('./package.json').version")"

      - name: Mint and Inject Courier Integrity Pin
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid release tag '$TAG'"; exit 1; }
          [[ "$VERSION" == "${TAG#v}" ]] || { echo "::error::release version does not match tag"; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="https://github.com/$REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          curl --fail --silent --show-error --location "$archive" --output "$work/first.tar.gz"
          curl --fail --silent --show-error --location "$archive" --output "$work/second.tar.gz"
          gzip -t "$work/first.tar.gz"
          gzip -t "$work/second.tar.gz"
          first="$(sha256sum "$work/first.tar.gz" | cut -d' ' -f1)"
          second="$(sha256sum "$work/second.tar.gz" | cut -d' ' -f1)"
          [[ "$first" == "$second" ]] || { echo "::error::release archive downloads were not reproducible"; exit 1; }
          digest="$first"
          export DIGEST="$digest"
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'package/bin/promptkit-os.js';
          const source = fs.readFileSync(file, 'utf8');
          const version = process.env.VERSION;
          const digest = process.env.DIGEST;
          const marker = '  // @pin-insert';
          const key = JSON.stringify(version);
          const entries = source.split('\n').filter((line) => line.trimStart().startsWith(`${key}:`));
          if (entries.length > 1) throw new Error(`duplicate integrity pin for ${version}`);
          if (entries.length === 1) {
            const existing = entries[0].match(/"([0-9a-f]{64})"/);
            if (!existing || existing[1] !== digest) throw new Error(`committed integrity pin for ${version} does not match archive`);
          } else {
            if (!/^[0-9a-f]{64}$/.test(digest)) throw new Error('invalid computed digest');
            if (source.split(marker).length !== 2) throw new Error('integrity pin insertion marker missing or duplicated');
            fs.writeFileSync(file, source.replace(marker, `  ${key}: ${JSON.stringify(digest)},\n${marker}`));
          }
          NODE
          node - <<'NODE'
          const courier = require('./package/bin/promptkit-os.js');
          const version = process.env.VERSION;
          if (courier.TARBALL_SHA256_BY_VERSION[version] !== process.env.DIGEST) {
            throw new Error(`post-injection integrity pin check failed for ${version}`);
          }
          console.log(`Verified courier integrity pin ${version}: ${process.env.DIGEST}`);
          NODE

      - name: Verify Courier Contents Are Minimal
        run: |
          cd package
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const allowed = new Set(['package.json','README.md','bin/promptkit-os.js']);
            const extra = files.filter(f => !allowed.has(f));
            if (extra.length) { console.error('unexpected files in tarball:', extra); process.exit(1); }
            console.log('tarball contents verified:', files.join(', '));
          "

      - name: Smoke Test Courier Against This Release
        env:
          PROMPTKIT_VERSION: ${{ steps.tag.outputs.version }}
          PROMPTKIT_REPO_ROOT: ${{ github.workspace }}
          PROMPTKIT_REQUIRE_INTEGRITY_PIN: "1"
        run: bash "$RUNNER_TEMP/hardened-smoke/smoke.sh"

      - name: Publish to npm with Provenance
        working-directory: package
        # Trusted publishing (OIDC): no long-lived token. The npmjs.com trusted
        # publisher entry (repo promptkit-os, workflow release-npm.yml) mints a
        # short-lived credential via the job's id-token; provenance is automatic.
        # The dashboard entry's optional Environment field must be left EMPTY,
        # because this job declares no `environment:` key — a non-empty value there
        # makes the OIDC exchange 403 on publisher mismatch.
        run: npm publish --provenance --access public

      - name: Report
        run: |
          echo "::notice::published promptkit-os@${{ steps.tag.outputs.version }} (courier for ${{ steps.tag.outputs.tag }})"
