name: PromptKit OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux:
    name: Lint & Validate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate Bash Script Syntax
        run: |
          bash -n init.sh
          bash -n scripts/measure-tokens.sh
          bash -n scripts/measure-per-task-tokens.sh
          bash -n scripts/measure-tokenizer-delta.sh
          bash -n scripts/measure-turbo-overhead.sh
          bash -n scripts/tests/run-token-budget-tests.sh
          bash -n scripts/validate-execution-control.sh
          bash -n scripts/validate-authorization-evidence.sh
          bash -n scripts/mint-courier-integrity-pin.sh
          bash -n scripts/check-milestone-halt-evidence.sh
          bash -n scripts/tests/run-authorization-evidence-fixtures.sh
          bash -n scripts/tests/run-milestone-halt-evidence-fixtures.sh
          bash -n scripts/tests/run-courier-integrity-pin-fixtures.sh
          bash -n scripts/tests/run-execution-control-fixtures.sh
          bash -n scripts/tests/run-execution-control-properties.sh
          bash -n scripts/validate-release-records.sh
          bash -n scripts/check-changelog-entry.sh
          bash -n scripts/check-math-labels.sh
          bash -n scripts/tests/run-release-record-properties.sh
          bash -n scripts/validate-ci-triage.sh
          bash -n scripts/tests/run-ci-triage-fixtures.sh
          bash -n scripts/validate-playbooks.sh
          bash -n scripts/tests/run-playbook-contract-tests.sh
          bash -n scripts/validate-lsp-evidence.sh
          bash -n scripts/tests/run-lsp-evidence-fixtures.sh
          bash -n scripts/tests/run-reference-link-tests.sh
          bash -n scripts/tests/run-behavioral-contract-tests.sh
          bash -n scripts/scan-staged-secrets.sh
          bash -n scripts/tests/run-staged-secret-scan-tests.sh
          bash -n scripts/run-behavioral-eval.sh
          bash -n scripts/tests/run-init-safety-tests.sh
          bash -n scripts/isolate-worktree.sh
          bash -n scripts/tests/run-worktree-isolation-tests.sh
          bash -n scripts/tests/run-profile-matrix.sh
          bash -n scripts/tests/run-terminal-picker-tests.sh
          bash -n scripts/tests/release-records.examples.sh
          bash -n scripts/check-checkpoint-ignore.sh
          bash -n scripts/check-setup-assert.sh
          bash -n scripts/tests/run-checkpoint-ignore-tests.sh
          bash -n scripts/check-synthetic-base.sh
          bash -n scripts/tests/run-synthetic-base-tests.sh
          bash -n scripts/check-doctor.sh
          bash -n scripts/tests/run-doctor-tests.sh
          echo "Bash scripts parsed with 0 syntax errors."

      - name: Run Documentation-Contract Tests (Bash)
        run: bash scripts/tests/run-behavioral-contract-tests.sh

      - name: Run Staged Secret Scan Regression Tests (Bash)
        run: bash scripts/tests/run-staged-secret-scan-tests.sh

      - name: Run Playbook Contract Tests (Bash)
        run: bash scripts/tests/run-playbook-contract-tests.sh

      - name: Run Behavioral Eval Offline Self-Test (Bash)
        run: bash scripts/run-behavioral-eval.sh --self-test

      - name: Run Harness Security Tests (Bash)
        run: bash scripts/tests/run-harness-security-tests.sh

      - name: Run Checkpoint Ignore Tests (Bash)
        run: bash scripts/tests/run-checkpoint-ignore-tests.sh

      - name: Run Synthetic Base Tests (Bash)
        run: bash scripts/tests/run-synthetic-base-tests.sh

      - name: Run Doctor Tests (Bash)
        run: bash scripts/tests/run-doctor-tests.sh

      - name: Run init.sh Safety Regression Tests (Bash)
        run: bash scripts/tests/run-init-safety-tests.sh

      - name: Run Worktree Isolation Regression Tests (Bash)
        run: bash scripts/tests/run-worktree-isolation-tests.sh

      - name: Run init Profile Matrix Tests (Bash)
        run: bash scripts/tests/run-profile-matrix.sh

      - name: Run Installer Terminal Picker Tests (Bash)
        run: bash scripts/tests/run-terminal-picker-tests.sh

      - name: Run Agent Execution Control Fixture Harness (Bash)
        run: bash scripts/tests/run-execution-control-fixtures.sh

      - name: Run Authorization Evidence Fixture Harness (Bash)
        run: bash scripts/tests/run-authorization-evidence-fixtures.sh

      - name: Run Milestone Halt Evidence Fixture Harness (Bash)
        run: bash scripts/tests/run-milestone-halt-evidence-fixtures.sh

      - name: Run Courier Integrity Pin Fixture Harness
        run: bash scripts/tests/run-courier-integrity-pin-fixtures.sh

      - name: Run Release Archive Commit-Binding Fixture Harness
        run: bash scripts/tests/run-release-archive-verification-fixtures.sh

      - name: Run Agent Execution Control Property Harness (Bash)
        run: bash scripts/tests/run-execution-control-properties.sh

      - name: Self-Validate Repository Execution Records (Bash)
        env:
          AUTHORIZATION_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline="$AUTHORIZATION_BASELINE"
          if [ -z "$baseline" ]; then baseline="origin/main"; fi
          bash scripts/validate-execution-control.sh --root . --strict --authorization-baseline "$baseline"

      - name: Run CI Triage Fixture Harness (Bash)
        run: bash scripts/tests/run-ci-triage-fixtures.sh

      - name: Run LSP Evidence Fixture Harness (Bash)
        run: bash scripts/tests/run-lsp-evidence-fixtures.sh

      - name: Run Reference-Link Harness (Bash)
        run: bash scripts/tests/run-reference-link-tests.sh

      - name: Run Release-Record Validator Fixtures (Bash)
        run: |
          bash scripts/validate-release-records.sh --root scripts/tests/fixtures/release-records/valid --strict
          bash scripts/validate-release-records.sh --root scripts/tests/fixtures/release-records/empty-range-deferred --strict

      - name: Run Release-Record Property Test Harness (Bash)
        run: bash scripts/tests/run-release-record-properties.sh

      - name: Run Release-Record Documentation Examples (Bash)
        run: bash scripts/tests/release-records.examples.sh

      - name: Run Release-Record Self-Validation Wrapper Harness (Bash)
        run: bash scripts/tests/run-release-self-validation-tests.sh

      - name: Assert Directive Token Budget (Bash)
        run: bash scripts/measure-tokens.sh --strict

      - name: Assert Per-Task Token Baselines (Bash)
        run: bash scripts/measure-per-task-tokens.sh --strict

      - name: Assert Turbo Protocol Overhead Claim Window (Bash)
        run: bash scripts/measure-turbo-overhead.sh --strict

      - name: Run Token Budget Gate Regression Tests (Bash)
        run: bash scripts/tests/run-token-budget-tests.sh

      - name: Run Release-Record Self-Validation with Grandfather Exemption (Bash)
        run: |
          set +e
          output=$(bash scripts/validate-release-records.sh --root . --strict 2>&1)
          exit_code=$?
          set -e
          printf '%s\n' "$output" | bash scripts/check-release-validation-output.sh --exit-code "$exit_code"

      - name: Test init.sh Dry-Run & Idempotency
        run: |
          chmod +x init.sh
          TEST_DIR="/tmp/test-project"
          mkdir -p "$TEST_DIR"
          ./init.sh "$TEST_DIR"

          for d in tasks specs adrs tests; do
            if [ ! -d "$TEST_DIR/docs/$d" ]; then
              echo "Error: Missing directory docs/$d"
              exit 1
            fi
          done

          test -f "$TEST_DIR/PROMPTKIT.md" || (echo "Error: Missing PROMPTKIT.md" && exit 1)
          test -f "$TEST_DIR/docs/STATE.md" || (echo "Error: Missing docs/STATE.md" && exit 1)
          test -f "$TEST_DIR/AGENTS.md" || (echo "Error: Missing AGENTS.md" && exit 1)
          grep -q "PromptKit OS: Engineering Operating System" "$TEST_DIR/AGENTS.md" || (echo "Error: Directive not found in AGENTS.md" && exit 1)

          # Idempotency re-run
          ./init.sh "$TEST_DIR"
          COUNT=$(grep -c "<!-- PROMPTKIT_START -->" "$TEST_DIR/AGENTS.md")
          if [ "$COUNT" -ne 1 ]; then
            echo "Error: Directive duplicated: expected 1 occurrence, found $COUNT"
            exit 1
          fi
          echo "Linux setup script and idempotency verified successfully."

      - name: Prompt Structure & Hygiene Check
        run: |
          echo "Validating workflow structure..."
          for wf in workflows/*.md; do
            if ! grep -q "^# " "$wf"; then
              echo "Error: Workflow $wf is missing a top-level H1 heading."
              exit 1
            fi
          done
          echo "Prompt hygiene check passed: all workflows have valid structural H1 headings."

      - name: Run Reference and Structural Validator (Bash)
        run: bash scripts/validate-references.sh .

      - name: Assert No Fragile Math Labels (Bash)
        run: bash scripts/check-math-labels.sh --root .

      - name: Assert CHANGELOG Entry for Behavior-Surface Changes (Bash)
        run: |
          git fetch origin main --depth=100
          git rev-parse --verify --quiet origin/main
          bash scripts/check-changelog-entry.sh

  validate-windows:
    name: Lint & Validate (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate PowerShell Script Syntax
        shell: pwsh
        run: |
          $syntaxFiles = @(
            "init.ps1",
            "scripts/terminal-picker.ps1",
            "scripts/measure-tokens.ps1",
            "scripts/measure-tokenizer-delta.ps1",
            "scripts/validate-execution-control.ps1",
            "scripts/tests/run-execution-control-fixtures.ps1",
            "scripts/tests/run-execution-control-properties.ps1",
            "scripts/validate-release-records.ps1",
            "scripts/check-changelog-entry.ps1",
            "scripts/check-math-labels.ps1",
            "scripts/tests/run-release-record-properties.ps1",
            "scripts/validate-ci-triage.ps1",
            "scripts/tests/run-ci-triage-fixtures.ps1",
            "scripts/validate-playbooks.ps1",
            "scripts/tests/run-playbook-contract-tests.ps1",
            "scripts/validate-lsp-evidence.ps1",
            "scripts/tests/run-lsp-evidence-fixtures.ps1",
            "scripts/tests/run-reference-link-tests.ps1",
            "scripts/tests/run-behavioral-contract-tests.ps1",
            "scripts/scan-staged-secrets.ps1",
            "scripts/tests/run-staged-secret-scan-tests.ps1",
            "scripts/run-behavioral-eval.ps1",
            "scripts/tests/run-init-safety-tests.ps1",
            "scripts/isolate-worktree.ps1",
            "scripts/tests/run-worktree-isolation-tests.ps1",
            "scripts/tests/run-profile-matrix.ps1",
            "scripts/tests/run-terminal-picker-tests.ps1",
            "scripts/tests/release-records.examples.ps1",
            "scripts/check-checkpoint-ignore.ps1",
            "scripts/check-setup-assert.ps1",
            "scripts/tests/run-checkpoint-ignore-tests.ps1",
            "scripts/check-synthetic-base.ps1",
            "scripts/tests/run-synthetic-base-tests.ps1",
            "scripts/check-doctor.ps1",
            "scripts/tests/run-doctor-tests.ps1",
            "scripts/tests/run-milestone-halt-evidence-fixtures.ps1"
          )
          foreach ($file in $syntaxFiles) {
            $errors = @()
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
          Write-Host "PowerShell scripts parsed with 0 syntax errors."

      - name: Run Documentation-Contract Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-behavioral-contract-tests.ps1

      - name: Run Staged Secret Scan Regression Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-staged-secret-scan-tests.ps1

      - name: Run Playbook Contract Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-playbook-contract-tests.ps1

      - name: Run Behavioral Eval Offline Self-Test (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\run-behavioral-eval.ps1 -SelfTest

      - name: Run Harness Security Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-harness-security-tests.ps1

      - name: Run Checkpoint Ignore Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-checkpoint-ignore-tests.ps1

      - name: Run Synthetic Base Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-synthetic-base-tests.ps1

      - name: Run Doctor Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-doctor-tests.ps1

      - name: Run init.ps1 Safety Regression Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-init-safety-tests.ps1

      - name: Run Worktree Isolation Regression Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-worktree-isolation-tests.ps1

      - name: Run init Profile Matrix Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-profile-matrix.ps1

      - name: Run Installer Terminal Picker Tests (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-terminal-picker-tests.ps1

      - name: Run Agent Execution Control Fixture Harness (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-execution-control-fixtures.ps1

      - name: Run Authorization Evidence Fixture Harness (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-authorization-evidence-fixtures.ps1

      - name: Run Milestone Halt Evidence Fixture Harness (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-milestone-halt-evidence-fixtures.ps1

      - name: Run Agent Execution Control Property Harness (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-execution-control-properties.ps1

      - name: Self-Validate Repository Execution Records (PowerShell)
        shell: pwsh
        env:
          AUTHORIZATION_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $baseline = $env:AUTHORIZATION_BASELINE
          if ([string]::IsNullOrWhiteSpace($baseline)) { $baseline = "origin/main" }
          pwsh -NoProfile -File .\scripts\validate-execution-control.ps1 -Root . -Strict -AuthorizationBaseline $baseline

      - name: Run CI Triage Fixture Harness (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-ci-triage-fixtures.ps1

      - name: Run LSP Evidence Fixture Harness (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-lsp-evidence-fixtures.ps1

      - name: Run Reference-Link Harness (PowerShell)
        run: pwsh -NoProfile -File .\scripts\tests\run-reference-link-tests.ps1

      - name: Run Release-Record Validator Fixtures (PowerShell)
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\validate-release-records.ps1 -Root .\scripts\tests\fixtures\release-records\valid -Strict
          pwsh -NoProfile -File .\scripts\validate-release-records.ps1 -Root .\scripts\tests\fixtures\release-records\empty-range-deferred -Strict

      - name: Run Release-Record Property Test Harness (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-release-record-properties.ps1

      - name: Run Release-Record Documentation Examples (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\release-records.examples.ps1

      - name: Run Release-Record Self-Validation Wrapper Harness (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\run-release-self-validation-tests.ps1

      - name: Assert Directive Token Budget (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\measure-tokens.ps1 -Strict

      - name: Run Release-Record Self-Validation with Grandfather Exemption (PowerShell)
        shell: pwsh
        run: |
          $res = & pwsh -NoProfile -File .\scripts\validate-release-records.ps1 -Root . -Strict *>&1
          $exitCode = $LASTEXITCODE
          $res | pwsh -NoProfile -File .\scripts\check-release-validation-output.ps1 -ExitCode $exitCode

      - name: Run Reference and Structural Validator (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\validate-references.ps1 -PromptKitDir .

      - name: Assert Per-Task Token Baselines (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\measure-per-task-tokens.ps1 --strict

      - name: Assert Turbo Protocol Overhead Claim Window (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\measure-turbo-overhead.ps1 --strict

      - name: Assert No Fragile Math Labels (PowerShell)
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\check-math-labels.ps1 -Root .

      - name: Assert CHANGELOG Entry for Behavior-Surface Changes (PowerShell)
        shell: pwsh
        run: |
          git fetch origin main --depth=100
          if ($LASTEXITCODE -ne 0) { throw "fetch of origin/main failed; cannot compute PR range" }
          git rev-parse --verify --quiet origin/main
          if ($LASTEXITCODE -ne 0) { throw "base ref origin/main missing after fetch" }
          pwsh -NoProfile -File .\scripts\check-changelog-entry.ps1

      - name: Test init.ps1 Dry-Run & Idempotency
        shell: pwsh
        run: |
          $testDir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\test-project" -Force
          .\init.ps1 -ProjectRoot $testDir.FullName

          $docDirs = @("tasks", "specs", "adrs", "tests")
          foreach ($d in $docDirs) {
            $p = Join-Path $testDir.FullName "docs\$d"
            if (-not (Test-Path $p)) {
              throw "Missing directory: docs\$d"
            }
          }

          if (-not (Test-Path (Join-Path $testDir.FullName "PROMPTKIT.md"))) {
            throw "Missing PROMPTKIT.md"
          }
          if (-not (Test-Path (Join-Path $testDir.FullName "docs\STATE.md"))) {
            throw "Missing docs/STATE.md"
          }
          if (-not (Test-Path (Join-Path $testDir.FullName "AGENTS.md"))) {
            throw "Missing AGENTS.md"
          }

          # Idempotency re-run
          .\init.ps1 -ProjectRoot $testDir.FullName
          $content = Get-Content (Join-Path $testDir.FullName "AGENTS.md") -Raw
          $matches = [regex]::Matches($content, "<!-- PROMPTKIT_START -->")
          if ($matches.Count -ne 1) {
            throw "Directive duplicated: expected 1 occurrence, found $($matches.Count)"
          }
          Write-Host "Windows setup dry-run and idempotency verified successfully."

  staged-secret-scan:
    name: Staged Secret Scan (PR Diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan The Pull Request Diff For Credential Patterns
        run: |
          git fetch origin main
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main unavailable; cannot scan the pull-request diff. Fetch the base ref (fetch-depth: 0) and re-run."
            exit 1
          fi
          git read-tree origin/main
          git add -A -- .
          if git diff --cached --quiet; then
            echo "No diff against origin/main to scan."
            exit 0
          fi
          bash scripts/scan-staged-secrets.sh .
